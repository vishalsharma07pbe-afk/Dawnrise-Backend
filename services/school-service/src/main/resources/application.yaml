server:
  port: 8080

spring:
  application:
    name: school-service

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}

  datasource:
    url: jdbc:postgresql://localhost:5432/school_service_db
    username: school_service_user
    password: ${SCHOOL_SERVICE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

dawnrise:
  school:
    default-time-zone: ${SCHOOL_DEFAULT_TIME_ZONE:Asia/Kolkata}

identity-service:
  provisioning:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    api-key: ${IDENTITY_INTERNAL_API_KEY}
    service-name: school-service

security:
  internal:
    api-key: ${SCHOOL_INTERNAL_API_KEY}
    allowed-service-names:
      - academic-service

platform:
  auth:
    jwt:
      audience: ${PLATFORM_JWT_AUDIENCE:dawnrise-operations}
      access-token-expiration: ${PLATFORM_ACCESS_TOKEN_EXPIRATION:900}
    refresh-token:
      expiration: ${PLATFORM_REFRESH_TOKEN_EXPIRATION:7d}
      absolute-session-lifetime: ${PLATFORM_REFRESH_TOKEN_ABSOLUTE_SESSION_LIFETIME:30d}
      cookie-name: ${PLATFORM_REFRESH_COOKIE_NAME:dawnrise_platform_refresh}
      cookie-path: /api/v1/platform/auth
      secure: ${PLATFORM_REFRESH_COOKIE_SECURE:false}
      same-site: Strict
  bootstrap:
    enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
    username: ${PLATFORM_BOOTSTRAP_USERNAME:}
    first-name: ${PLATFORM_BOOTSTRAP_FIRST_NAME:}
    middle-name: ${PLATFORM_BOOTSTRAP_MIDDLE_NAME:}
    last-name: ${PLATFORM_BOOTSTRAP_LAST_NAME:}
    email: ${PLATFORM_BOOTSTRAP_EMAIL:}
    phone: ${PLATFORM_BOOTSTRAP_PHONE:}

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5432/identity_service_db
    username: identity_service_user
    password: ${IDENTITY_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

server:
  port: 8081

jwt:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem
  access-token-expiration: 900

security:
  internal:
    api-key: ${IDENTITY_INTERNAL_API_KEY}
    allowed-service-names:
      - school-service
      - academic-service

  activation-token:
    expiration: 24h
    resend-window: 24h
    max-emails-per-window: 3

  refresh-token:
    expiration: 30d
    absolute-session-lifetime: 90d
    short-session-roles:
      - ADMIN
      - PRINCIPAL
      - HR
      - ACCOUNTANT
    short-session-expiration: 7d
    short-session-absolute-lifetime: 30d
    standard-session-roles:
      - TEACHER
      - STUDENT
      - PARENT
    standard-session-expiration: 30d
    standard-session-absolute-lifetime: 90d
    cookie-name: dawnrise_refresh
    cookie-path: /api/v1/auth
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: Strict

  password-reset-token:
    expiration: 1h
    request-window: 24h
    max-emails-per-window: 3
  password-change:
    cooldown: 24h
  login-lockout:
    first-failure-threshold: 5
    escalated-failure-threshold: 3
    first-lock-duration: 30m
    second-lock-duration: 30d
    final-lock-duration: 365d
    locked-message-prefix: "Account is locked until "
    locked-message-suffix: ". Please contact an admin to unlock sooner."

app:
  activation:
    base-url: ${ACTIVATION_BASE_URL:http://localhost:5174/activate}
    from-address: ${ACTIVATION_EMAIL_FROM:no-reply@dawnrise.com}

  platform-activation:
    base-url: ${PLATFORM_ACTIVATION_BASE_URL:http://localhost:5173/platform/activate}
    from-address: ${PLATFORM_ACTIVATION_EMAIL_FROM:no-reply@dawnrise.in}

  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5174/reset-password}
    platform-base-url: ${PLATFORM_PASSWORD_RESET_BASE_URL:http://localhost:5173/platform/reset-password}
    from-address: ${PASSWORD_RESET_EMAIL_FROM:${ACTIVATION_EMAIL_FROM:no-reply@dawnrise.com}}

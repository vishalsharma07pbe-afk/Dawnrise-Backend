identity-service:
  internal:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
    api-key: ${IDENTITY_INTERNAL_API_KEY}
    service-name: academic-service

school-service:
  internal:
    base-url: ${SCHOOL_SERVICE_BASE_URL:http://localhost:8080}
    connect-timeout: 2s
    read-timeout: 5s
    api-key: ${SCHOOL_INTERNAL_API_KEY}
    service-name: academic-service

server:
  port: 8082

spring:
  servlet:
    multipart:
      max-file-size: ${STUDENT_ATTENDANCE_IMPORT_HTTP_MAX_FILE_SIZE:2MB}
      max-request-size: ${STUDENT_ATTENDANCE_IMPORT_HTTP_MAX_REQUEST_SIZE:3MB}
  application:
    name: academic-service

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${IDENTITY_JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}

  datasource:
    url: jdbc:postgresql://localhost:5432/academic_service_db
    username: academic_service_user
    password: ${ACADEMIC_SERVICE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

dawnrise:
  student-attendance:
    import:
      max-file-bytes: ${STUDENT_ATTENDANCE_IMPORT_MAX_FILE_BYTES:2097152}
      preview-ttl: ${STUDENT_ATTENDANCE_IMPORT_PREVIEW_TTL:PT30M}
    reporting:
      max-date-range-days: ${STUDENT_ATTENDANCE_REPORTING_MAX_DATE_RANGE_DAYS:366}
      max-page-size: ${STUDENT_ATTENDANCE_REPORTING_MAX_PAGE_SIZE:100}
      max-export-rows: ${STUDENT_ATTENDANCE_REPORTING_MAX_EXPORT_ROWS:10000}
    max-records-per-request: ${STUDENT_ATTENDANCE_MAX_RECORDS:200}
    max-calendar-days-per-academic-year: ${STUDENT_ATTENDANCE_MAX_CALENDAR_DAYS:400}
    default-attendance-mode: ${STUDENT_ATTENDANCE_DEFAULT_MODE:DAILY}
    default-week-start-day: ${STUDENT_ATTENDANCE_DEFAULT_WEEK_START_DAY:MONDAY}
    default-late-penalty-enabled: ${STUDENT_ATTENDANCE_DEFAULT_LATE_PENALTY_ENABLED:false}
    default-late-occurrences-threshold: ${STUDENT_ATTENDANCE_DEFAULT_LATE_OCCURRENCES_THRESHOLD:3}
    default-late-penalty-outcome: ${STUDENT_ATTENDANCE_DEFAULT_LATE_PENALTY_OUTCOME:HALF_DAY}
    default-late-counting-period: ${STUDENT_ATTENDANCE_DEFAULT_LATE_COUNTING_PERIOD:MONTHLY}
    default-deferred-entry-enabled: ${STUDENT_ATTENDANCE_DEFAULT_DEFERRED_ENTRY_ENABLED:true}
    default-teacher-back-entry-days: ${STUDENT_ATTENDANCE_DEFAULT_TEACHER_BACK_ENTRY_DAYS:0}
    default-leadership-back-entry-days: ${STUDENT_ATTENDANCE_DEFAULT_LEADERSHIP_BACK_ENTRY_DAYS:30}
    default-automatic-submission-enabled: ${STUDENT_ATTENDANCE_DEFAULT_AUTO_SUBMIT_ENABLED:false}
    automatic-submission-scheduler-enabled: ${STUDENT_ATTENDANCE_AUTO_SUBMIT_SCHEDULER_ENABLED:false}
    automatic-submission-scheduler-delay: ${STUDENT_ATTENDANCE_AUTO_SUBMIT_SCHEDULER_DELAY:PT5M}
    automatic-submission-scheduler-initial-delay: ${STUDENT_ATTENDANCE_AUTO_SUBMIT_SCHEDULER_INITIAL_DELAY:PT5M}
    automatic-submission-candidate-batch-size: ${STUDENT_ATTENDANCE_AUTO_SUBMIT_CANDIDATE_BATCH_SIZE:100}
    default-draft-warning-minutes: ${STUDENT_ATTENDANCE_DEFAULT_WARNING_MINUTES:10}
    default-automatic-submission-minutes: ${STUDENT_ATTENDANCE_DEFAULT_AUTO_SUBMIT_MINUTES:20}
    default-status-credits:
      PRESENT:
        earned-credit: ${STUDENT_ATTENDANCE_PRESENT_EARNED_CREDIT:1.00}
        possible-credit: ${STUDENT_ATTENDANCE_PRESENT_POSSIBLE_CREDIT:1.00}
      ABSENT:
        earned-credit: ${STUDENT_ATTENDANCE_ABSENT_EARNED_CREDIT:0.00}
        possible-credit: ${STUDENT_ATTENDANCE_ABSENT_POSSIBLE_CREDIT:1.00}
      LATE:
        earned-credit: ${STUDENT_ATTENDANCE_LATE_EARNED_CREDIT:1.00}
        possible-credit: ${STUDENT_ATTENDANCE_LATE_POSSIBLE_CREDIT:1.00}
      HALF_DAY:
        earned-credit: ${STUDENT_ATTENDANCE_HALF_DAY_EARNED_CREDIT:0.50}
        possible-credit: ${STUDENT_ATTENDANCE_HALF_DAY_POSSIBLE_CREDIT:1.00}
      EXCUSED:
        earned-credit: ${STUDENT_ATTENDANCE_EXCUSED_EARNED_CREDIT:0.00}
        possible-credit: ${STUDENT_ATTENDANCE_EXCUSED_POSSIBLE_CREDIT:0.00}
    default-working-day-weight: ${STUDENT_ATTENDANCE_DEFAULT_WORKING_DAY_WEIGHT:1.00}
